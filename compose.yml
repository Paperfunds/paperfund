name: paperfund

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paperfund
      POSTGRES_USER: paperfund
      POSTGRES_PASSWORD: paperfund
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paperfund -d paperfund']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - paperfund-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - paperfund-redis:/data

volumes:
  paperfund-postgres:
  paperfund-redis:
